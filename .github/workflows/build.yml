name: Build executables

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ArghMateyMusic
          --collect-all yt_dlp
          --collect-data certifi
          --hidden-import PIL._tkinter_finder
          --paths src
          src/app.py

      - name: Package release zip
        shell: bash
        run: |
          mkdir release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/ArghMateyMusic.exe release/
          else
            cp dist/ArghMateyMusic release/
          fi
          cp "EXAMPLE EXCEL SHEET.xlsx" README.md release/
          python -c "import shutil; shutil.make_archive('ArghMateyMusic-${{ runner.os }}', 'zip', 'release')"

      - uses: actions/upload-artifact@v4
        with:
          name: ArghMateyMusic-${{ runner.os }}
          path: ArghMateyMusic-${{ runner.os }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ArghMateyMusic-*
          path: downloads
          merge-multiple: true

      - name: Create release with notes
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*.zip
          generate_release_notes: true
